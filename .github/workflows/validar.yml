name: Validar modelo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r pipeline/requirements.txt
      - run: python -m unittest discover -s pipeline/tests -v
      - run: python scripts/verificar_repositorio.py
      - run: npm ci
      - run: npm run typecheck
